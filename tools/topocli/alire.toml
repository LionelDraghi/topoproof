name = "topocli"
description = "Command-line client of the TopoProof kernel"
version = "0.1.4-dev"

authors = ["Lionel Draghi"]
maintainers = ["Lionel Draghi <lionel.draghi@free.fr>"]
maintainers-logins = ["LionelDraghi"]
licenses = "Apache-2.0"
website = "https://github.com/LionelDraghi/topoproof"
tags = ["spark", "formal-methods", "geometry", "cad", "proof"]

executables = ["topocli"]
project-files = ["topocli.gpr"]

[configuration]
generate_C = false
generate_gpr = false

[[depends-on]]
# The client crate evolves in lockstep with the kernel: the path pin below
# always takes the local topoproof, whatever its version. The permissive
# constraint keeps the client resolution valid across the root crate's
# version bumps.
topoproof = ">=0"

[[depends-on]]
# The embedded interpreter of the TopoScript scripting facility
# (development plan, Milestone 6). Bounded below 0.46: a 0.x release
# of hac may change its embedding API, and the client validates one
# subset of it.
hac = "~0.45.0"

[[pins]]
topoproof = { path = "../.." }
