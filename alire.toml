name = "topoproof"
description = "Provable geometry command-line application"
version = "0.1.5-dev"

authors = ["Lionel Draghi"]
maintainers = ["Lionel Draghi <lionel.draghi@free.fr>"]
maintainers-logins = ["LionelDraghi"]
licenses = "Apache-2.0"
website = "https://github.com/LionelDraghi/topoproof"
tags = ["spark", "formal-methods", "geometry", "cad", "proof"]

project-files = ["topoproof.gpr"]

[configuration]
output_dir = "src/Alire_config"
generate_C = false
generate_gpr = false

[[depends-on]]
# SPARK 16.x pairs with the GNAT 16 toolchain
gnat = ">=16"

# No bbt dependency: make test runs the Markdown pages through bbt 0.6
# (needed for --cleanup=full, --index and --generate_badge), but 0.6 is
# not published to the community index yet, and the published 0.5.0 does
# not compile with GNAT 16. Until 0.6 lands in the index, bbt is an
# external tool: the CI builds the latest bbt from its repository, and
# local runs use the bbt on the PATH. Restore the dependency once 0.6 is
# published:
#   [[depends-on]]
#   bbt = ">=0.6.0"

[[depends-on]]
# formal verification: make prove runs GNATprove
gnatprove = "^16.1.0"

[[depends-on]]
# source formatting: make format runs GNATformat
# The source crate gnatformat is not installable yet: its stack needs the
# libgmp system crate, marked available = false in the community index, and
# libgpr2 26, incompatible with GNAT 16. The binary release is used instead.
# TopoProof targets Linux only for now.
gnatformat_bin = "^26.0.0"

[[depends-on]]
# test coverage: make coverage runs GNATcoverage
# Same release train as gnatformat_bin (26.x pairs with GNAT 16); the
# binary crate is used directly, the source crate adds nothing here.
gnatcov_bin = "^26.2.1"

[[actions]]
# alr test builds the application and runs the Markdown documentation
# through bbt
type = "test"
command = ["make", "test"]

# No [build-switches] here: the project files (topoproof.gpr,
# tools/topocli/topocli.gpr) own the switches, so the local builds and the CI
# builds compile with one single profile. Alire build-switches are ignored
# whenever the project defines its own Compiler.Default_Switches, which
# made the profiles silently diverge.
