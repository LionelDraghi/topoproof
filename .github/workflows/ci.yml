name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-bbt:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: alire-project/setup-alire@latest
      # GNU make is preinstalled on the Linux and macOS runners; the
      # Windows runner needs it.
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install -y make
      # The macos-26 runner image ships Command Line Tools 27, whose
      # SDK breaks the GNAT FSF linker: the system and unwinder
      # symbols of libgnat fail to resolve (alire-project/GNAT-FSF-
      # builds issue 112). The image still carries the macOS 26 SDK:
      # point the Command Line Tools SDK back at it, as the alire
      # index CI does (setting SDKROOT has no effect).
      - name: Select the macOS 26 SDK (macOS)
        if: runner.os == 'macOS'
        run: sudo ln -sfn MacOSX26.sdk /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk

      # The Windows default Alire cache lives deep under %LOCALAPPDATA%:
      # the dependency builds of the bbt clone exceed the 260-character
      # path limit and Alire fails to sync them. A short cache path
      # avoids the limit.
      - name: Use a short Alire cache path (Windows)
        if: runner.os == 'Windows'
        run: alr settings --global --set cache.dir "D:\alire-cache"
      # bbt 0.6 is not released to the Alire index yet, and the released
      # version does not compile with GNAT 16: the CI builds the latest
      # bbt from its repository, until 0.6 lands in the index and alr
      # install becomes enough again. The binary joins the PATH for
      # the make test recipes. RUNNER_TEMP is used instead of /tmp so
      # that the PATH entry is also a valid path on the Windows runner.
      - name: Install bbt (latest)
        shell: bash
        run: |
          git clone --depth 1 https://github.com/LionelDraghi/bbt "$RUNNER_TEMP/bbt"
          cd "$RUNNER_TEMP/bbt" && alr --non-interactive build --release
          echo "$RUNNER_TEMP/bbt" >> "$GITHUB_PATH"
      # The recipes run under bash: the POSIX shell of the Linux and
      # macOS runners, and Git Bash on Windows.
      - name: Build and execute Markdown specifications
        shell: bash
        run: make test
      # The tests evidence is part of the repository: badge and results
      # index must match the fresh run of this job.
      - name: Check the committed tests evidence
        if: matrix.os == 'ubuntu-latest'
        run: git diff --exit-code docs/tests/
        shell: bash
      - name: Upload bbt evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bbt-evidence-${{ matrix.os }}
          path: artifacts/bbt/
  prove:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The SARIF upload below creates code scanning alerts, which needs
    # security-events: write on top of the workflow-wide contents: read.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: alire-project/setup-alire@latest
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install -y make
      # The macos-26 runner image ships Command Line Tools 27, whose
      # SDK breaks the GNAT FSF linker: the system and unwinder
      # symbols of libgnat fail to resolve (alire-project/GNAT-FSF-
      # builds issue 112). The image still carries the macOS 26 SDK:
      # point the Command Line Tools SDK back at it, as the alire
      # index CI does (setting SDKROOT has no effect).
      - name: Select the macOS 26 SDK (macOS)
        if: runner.os == 'macOS'
        run: sudo ln -sfn MacOSX26.sdk /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk

      - run: make prove
        shell: bash

      # The SPARK badge data is part of the repository: it must match
      # the fresh evidence of this run.
      - name: Check the committed SPARK badge data
        if: matrix.os == 'ubuntu-latest'
        run: git diff --exit-code proof-status.json
        shell: bash

      # Code scanning upload: GNATprove >= 26 writes the SARIF file (see
      # SARIF_SWITCHES in the Makefile; not yet active with 16.1). The
      # hashFiles guard skips the step until the file is generated, so it
      # activates with the toolchain upgrade without any change here.
      # if: always() also uploads the SARIF of failed proof runs.
      # The upload runs once, from the Linux run only: uploading the
      # same alerts once per platform would duplicate them.
      - name: Upload GNATprove SARIF
        if: always() && matrix.os == 'ubuntu-latest' && hashFiles('artifacts/gnatprove/gnatprove.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: artifacts/gnatprove/gnatprove.sarif

      - name: Upload GNATprove evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnatprove-evidence-${{ matrix.os }}
          path: artifacts/gnatprove/
