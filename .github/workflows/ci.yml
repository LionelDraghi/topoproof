name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A new push cancels the run still in flight: iterating on main
  # starts a fresh run immediately instead of queueing behind the
  # outdated one.
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-bbt:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: alire-project/setup-alire@latest
      # GNU make is preinstalled on the Linux and macOS runners; the
      # Windows runner needs it.
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install -y make
      - name: Cache Alire dependencies
        uses: actions/cache@v4
        with:
          # On Linux, alire data is in ~/.cache/alire and
          # ~/.local/share/alire; on Windows runners (runneradmin
          # user), it is in %LOCALAPPDATA%\alire, and the relocated
          # cache is C:\alr-cache. The cached toolchains are the slow
          # part of every job: without the cache, gnat_native,
          # gnatprove and gnatformat_bin are re-downloaded at each
          # run. The key is per job, so that the prove job, which
          # caches the toolchains only, does not save the entry of
          # build-and-bbt, which also caches the bbt dependency
          # builds: both jobs end on the same key otherwise, and the
          # first to finish wins.
          path: |
            ~/.cache/alire
            ~/.local/share/alire
            ~/AppData/Local/alire
            C:/alr-cache
          key: ${{ matrix.os }}-alire-${{ github.job }}-${{ hashFiles('alire.toml', 'tools/topocli/alire.toml') }}
          restore-keys: |
            ${{ matrix.os }}-alire-${{ github.job }}-
            ${{ matrix.os }}-alire-

      # The macos-26 runner image ships Command Line Tools 27, whose
      # SDK breaks the GNAT FSF linker: the system and unwinder
      # symbols of libgnat fail to resolve (alire-project/GNAT-FSF-
      # builds issue 112). The image still carries the macOS 26 SDK:
      # point the Command Line Tools SDK back at it, as the alire
      # index CI does (setting SDKROOT has no effect).
      - name: Select the macOS 26 SDK (macOS)
        if: runner.os == 'macOS'
        run: sudo ln -sfn MacOSX26.sdk /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk

      # The alr GNAT runtime copies files through a 256-character path
      # buffer: with the default cache under %LOCALAPPDATA%\alire\cache,
      # the build dir of dependencies with deep trees, such as sparklib,
      # exceeds it and alr build fails with "Could not sync build dir"
      # (cf. alire-project/alire issue 1762). A short cache root keeps
      # every path under the limit, as in the bbt CI.
      - name: Relocate the Alire cache (Windows)
        if: runner.os == 'Windows'
        run: alr settings --global --set cache.dir C:\alr-cache
      # bbt 0.6 is not released to the Alire index yet, and the released
      # version does not compile with GNAT 16: the CI builds the latest
      # bbt from its repository, until 0.6 lands in the index and alr
      # install becomes enough again. The binary joins the PATH for
      # the make test recipes. RUNNER_TEMP is used instead of /tmp so
      # that the PATH entry is also a valid path on the Windows runner.
      - name: Install bbt (latest)
        shell: bash
        run: |
          git clone --depth 1 https://github.com/LionelDraghi/bbt "$RUNNER_TEMP/bbt"
          cd "$RUNNER_TEMP/bbt" && alr --non-interactive build --release
          echo "$RUNNER_TEMP/bbt" >> "$GITHUB_PATH"
      # The ubuntu-26.04 runner image no longer ships xmllint
      # (libxml2-utils); the diagram validation of make test needs it.
      - name: Install xmllint (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      # The recipes run under bash: the POSIX shell of the Linux and
      # macOS runners, and Git Bash on Windows.
      - name: Build and execute Markdown specifications
        shell: bash
        run: make test
      # The tests evidence is part of the repository: badge and results
      # index must match the fresh run of this job.
      - name: Check the committed tests evidence
        if: matrix.os == 'ubuntu-latest'
        run: git diff --exit-code docs/tests_results/
        shell: bash
      - name: Upload bbt evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bbt-evidence-${{ matrix.os }}
          path: artifacts/bbt/
  prove:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The SARIF upload below creates code scanning alerts, which needs
    # security-events: write on top of the workflow-wide contents: read.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: alire-project/setup-alire@latest
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install -y make
      - name: Cache Alire dependencies
        uses: actions/cache@v4
        with:
          # On Linux, alire data is in ~/.cache/alire and
          # ~/.local/share/alire; on Windows runners (runneradmin
          # user), it is in %LOCALAPPDATA%\alire, and the relocated
          # cache is C:\alr-cache. The cached toolchains are the slow
          # part of every job: without the cache, gnat_native,
          # gnatprove and gnatformat_bin are re-downloaded at each
          # run. The key is per job, so that the prove job, which
          # caches the toolchains only, does not save the entry of
          # build-and-bbt, which also caches the bbt dependency
          # builds: both jobs end on the same key otherwise, and the
          # first to finish wins.
          path: |
            ~/.cache/alire
            ~/.local/share/alire
            ~/AppData/Local/alire
            C:/alr-cache
          key: ${{ matrix.os }}-alire-${{ github.job }}-${{ hashFiles('alire.toml', 'tools/topocli/alire.toml') }}
          restore-keys: |
            ${{ matrix.os }}-alire-${{ github.job }}-
            ${{ matrix.os }}-alire-

      # The macos-26 runner image ships Command Line Tools 27, whose
      # SDK breaks the GNAT FSF linker: the system and unwinder
      # symbols of libgnat fail to resolve (alire-project/GNAT-FSF-
      # builds issue 112). The image still carries the macOS 26 SDK:
      # point the Command Line Tools SDK back at it, as the alire
      # index CI does (setting SDKROOT has no effect).
      - name: Select the macOS 26 SDK (macOS)
        if: runner.os == 'macOS'
        run: sudo ln -sfn MacOSX26.sdk /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk

      # Proof results cache: gnatprove saves every successful proof in
      # obj/gnatprove-cache (the --memcached-server=file: switch of the
      # Makefile recipes), and reuses them on the next run, so a run
      # redoes only the checks its change touched. The key changes at
      # each commit: the run saves its fresh results under the new key,
      # and restore-keys recovers the most recent previous entry, which
      # is the proof of everything the commit did not touch. The cache
      # is per platform: proof results are not guaranteed to transfer
      # between runtimes and predefined type sizes. Not saved on
      # Windows: the gnatprove file cache crashes there (see Makefile).
      - name: Cache GNATprove proof results
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: obj/gnatprove-cache
          key: ${{ matrix.os }}-gnatprove-${{ github.sha }}
          restore-keys: |
            ${{ matrix.os }}-gnatprove-

      - run: make prove
        shell: bash

      # The SPARK badge data is part of the repository: it must match
      # the fresh evidence of this run.
      - name: Check the committed SPARK badge data
        if: matrix.os == 'ubuntu-latest'
        run: git diff --exit-code proof-status.json
        shell: bash

      # Code scanning upload: GNATprove >= 26 writes the SARIF file (see
      # SARIF_SWITCHES in the Makefile; not yet active with 16.1). The
      # hashFiles guard skips the step until the file is generated, so it
      # activates with the toolchain upgrade without any change here.
      # if: always() also uploads the SARIF of failed proof runs.
      # The upload runs once, from the Linux run only: uploading the
      # same alerts once per platform would duplicate them.
      - name: Upload GNATprove SARIF
        if: always() && matrix.os == 'ubuntu-latest' && hashFiles('artifacts/gnatprove/gnatprove.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: artifacts/gnatprove/gnatprove.sarif
          # The category separates this upload from the coverage job's
          # SARIF of the same commit: same-category uploads overwrite
          # each other, and the default is the workflow name for both.
          category: gnatprove

      - name: Upload GNATprove evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnatprove-evidence-${{ matrix.os }}
          path: artifacts/gnatprove/

  # Test coverage of the kernel with GNATcoverage (make coverage): the
  # suite runs once against an instrumented build, and the consolidation
  # produces the SARIF file (code scanning) and the xcov annotated
  # sources (job artifact). Linux only, like every evidence upload: one
  # platform produces the evidence, the others would just duplicate it.
  coverage:
    runs-on: ubuntu-latest
    # The SARIF upload creates code scanning alerts, which needs
    # security-events: write on top of the workflow-wide contents: read.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: alire-project/setup-alire@latest
      - name: Cache Alire dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/alire
            ~/.local/share/alire
          key: ${{ github.job }}-alire-${{ hashFiles('alire.toml', 'tools/topocli/alire.toml') }}
          restore-keys: |
            ${{ github.job }}-alire-

      - name: Build the latest bbt from its repository
        run: |
          git clone --depth 1 https://github.com/LionelDraghi/bbt "$RUNNER_TEMP/bbt"
          cd "$RUNNER_TEMP/bbt" && alr --non-interactive build --release
          echo "$RUNNER_TEMP/bbt" >> "$GITHUB_PATH"

      # Same xmllint need as the build-and-bbt job: the test-run recipes
      # validate every generated diagram.
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Collect the kernel test coverage
        run: make coverage COVERAGE_FORMATS=report,sarif
        shell: bash

      # The coverage badge data is part of the repository: it must match
      # the fresh evidence of this run.
      - name: Check the committed coverage badge data
        run: git diff --exit-code coverage-status.json
        shell: bash

      - name: Upload coverage SARIF
        if: always() && hashFiles('artifacts/coverage/coverage.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: artifacts/coverage/coverage.sarif
          # Distinct from the prove job's category: same-category uploads
          # overwrite each other.
          category: coverage

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-evidence
          path: artifacts/coverage/
